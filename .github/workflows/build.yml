name: Build

on:
  push:
    branches: [ DEVEL ]
  pull_request:
    branches: [ main, DEVEL ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WindowsTerminalFlow.sln
      - name: Build
        run: dotnet build WindowsTerminalFlow.sln -c Release --no-restore
